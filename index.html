heck the mountains are still there",x:68.5,y:15,r:2.5,route:"odysseys"},{text:"she keeps the drawings of things she never built",x:40.5,y:27,r:-1.5,route:"archive-of-me"}]},hn=[{id:"marginalia",title:"Marginalia",w:58,h:330,material:"linen",color:"#6d6f3e",ink:"#f2ead8",face:"serif",size:28,mark:"band",blurb:"Notes that did not make it into the main text.",cue:"Read the margins"},{id:"bibliotech",title:"Bibliotech",w:76,h:374,material:"leather",color:"#24402f",ink:"#d9b768",face:"serif",size:28,mark:"gilt",blurb:"Upanishads next to pricing theory. They get along.",cue:"Browse the shelves"},{id:"odysseys",title:"Odysseys",w:52,h:306,material:"khadi",color:"#b05a3b",ink:"#f6ecdc",face:"serif",size:24,mark:"none",blurb:"Temples, trains, and a list of hills to end up on.",cue:"Spread the postcards"},{id:"sparks",title:"Sparks",w:44,h:262,material:"marble",color:"#a78a55",ink:"#26261f",face:"serif",size:24,mark:"label",blurb:"Small true things that were hard to put down.",cue:"Strike a match"},{id:"makers-room",title:"The Maker\u2019s Room",w:86,h:350,material:"canvas",color:"#e6dcc3",ink:"#2a2a24",face:"serif",size:28,mark:"paint",blurb:"Acrylics, sketches, and one canvas you can add to.",cue:"Go in, mind the paint"},{id:"scent-archive",title:"The Scent Archive",w:50,h:296,material:"leather",color:"#8c5a2b",ink:"#f3e4c6",face:"serif",size:24,mark:"band",blurb:"Why a perfume at noon is not the perfume you bought.",cue:"Uncork"},{id:"cultural-cabinet",title:"The Cultural Cabinet",w:70,h:386,material:"brocade",color:"#1f3a2b",ink:"#e2c077",face:"serif",size:28,mark:"gilt",blurb:"Plan chests of cloth, gold and memory.",cue:"Pull a drawer"},{id:"human-condition",title:"The Human Condition",w:56,h:344,material:"linen",color:"#2c2d29",ink:"#ece3cf",face:"serif",size:28,mark:"none",blurb:"People, and what they are like when they think no one is keeping notes.",cue:"Weigh it up"},{id:"currently",title:"Currently",w:34,h:250,material:"paper",color:"#d8cdb2",ink:"#34342c",face:"serif",size:24,mark:"tape",blurb:"Torn off the calendar this week.",cue:"See this week"},{id:"archive-of-me",title:"The Archive of Me",w:66,h:362,material:"leather",color:"#7b3524",ink:"#f0dfc4",face:"serif",size:24,mark:"gilt",blurb:"A life, floor by floor. Upper floors under construction.",cue:"Take the lift"}],hc=[{id:"attire-archive",title:"The Indian Attire Archive",blurb:"Six yards of silk, no stitches, 108 ways to wear it."}];var Ti=[{id:"perfume",art:"Perfume",name:"A bottle, a third gone",label:"Eau de something. Changes by the hour.",route:"scent-archive",span:"tall",hover:"spray"},{id:"drawing",art:"Drawing",name:"Section through a shikhara",label:"One line is wrong. Nobody has found it.",hover:"draw",story:{title:"Section through a shikhara",draft:!0,body:["Five years of architecture school leave you unable to walk into a room without checking where the light comes from. At NIT Hamirpur the lesson was mostly about lines: every line on a drawing eventually costs someone money.","Temples are the buildings that keep sending me back to the drawing board. A Nagara shikhara is a tower made of smaller versions of itself, each one stacked on the last until the shape dissolves into the sky. Long before anyone used the word fractal, masons were building it in sandstone.","The drawing in the cabinet is unfinished. That one is on purpose."],link:{href:"https://whc.unesco.org/en/list/240/",text:"Khajuraho group of monuments, UNESCO"}}},{id:"swatch",art:"Swatch",name:"Banarasi offcut",label:"Handle by the edges.",route:"attire-archive",hover:"glint"},{id:"compass",art:"Compass",name:"Brass compass",label:"Points at you. It has opinions.",route:"odysseys",hover:"needle"},{id:"postcard",art:"Postcard",name:"Unsent postcard",label:"Addressed to a future address.",route:"odysseys",span:"wide",hover:"flip"},{id:"books",art:"BookStack",name:"Three books, one bookmark",label:"Bookmark is a boarding pass.",route:"bibliotech",hover:"lift"},{id:"juttis",art:"Juttis",name:"A pair of juttis",label:"They do not have a left or a right.",hover:"tap",story:{title:"A pair of juttis",body:["Traditional hand-made juttis are often cut straight, with no left foot or right foot. The shoe learns which one it is from the person who wears it.","It is a small thing to admire in an object: it arrives undecided, and takes the shape of a particular life. The first week hurts. People who wear them will tell you that is the point. I am still deciding if that is wisdom or marketing."],draft:!0}},{id:"painting",art:"Canvas",name:"Unfinished canvas",label:"Still wet, by choice.",route:"makers-room",span:"tall",hover:"paint"},{id:"miniature",art:"Miniature",name:"A very small painting",label:"Hills, one bird, no rush.",route:"makers-room",span:"tall",hover:"bird"},{id:"diya",art:"Diya",name:"Brass diya",label:"Lights itself at night.",hover:"flame",story:{title:"Asato m\u0101 sad gamaya",draft:!0,body:["\u0905\u0938\u0924\u094B \u092E\u093E \u0938\u0926\u094D\u0917\u092E\u092F\u0964 \u0924\u092E\u0938\u094B \u092E\u093E \u091C\u094D\u092F\u094B\u0924\u093F\u0930\u094D\u0917\u092E\u092F\u0964","From the B\u1E5Bhad\u0101ra\u1E47yaka Upani\u1E63ad (1.3.28). Lead me from the unreal to the real, from darkness to light. It is one of the oldest requests on record, and I like that it is phrased as a request.","Sanskrit interests me partly as an engineer's pleasure. P\u0101\u1E47ini's grammar compressed a whole language into about four thousand short rules. Vedic chant survived for centuries because of error-checking recitation patterns that read each passage in multiple orders. It is possible to be moved by a verse and also impressed by its checksum."],link:{href:"https://en.wikipedia.org/wiki/Pavamana_Mantra",text:"The Pavam\u0101na Mantra"}}},{id:"tabla",art:"Tabla",name:"The dayan",label:"Tap it. Politely.",hover:"beat",play:!0,story:{title:"The black circle",body:["The black circle on a tabla is called the syahi. It is a paste of iron filings and flour laid on in many thin coats, and it is the reason the drum can hold a clear, tuned pitch, which most drums cannot.","C. V. Raman studied this from 1920 onward and found the loaded membrane gives harmonic overtones. A physics Nobel laureate looked closely at a drumhead and found someone had already solved the problem by ear."],link:{href:"https://en.wikipedia.org/wiki/Tabla",text:"On the tabla"}}},{id:"matchbox",art:"Matchbox",name:"A 2\xD72 on a matchbox",label:"Consulting is hard to quit.",hover:"slide",story:{title:"A 2\xD72 on a matchbox",draft:!0,body:["Vertical axis: does it pay. Horizontal axis: would I do it anyway. I have used this one for job offers, business ideas and, once, a sofa.","Years of strategy, telecom, real estate and technology have left me able to draw a market on any flat surface. They have also left a list of small businesses I would like to try building. Some are serious. Most are excuses to learn how something is made.","The top-right box is empty on this matchbox. I am told that is common."]}},{id:"kiri",art:"Zine",name:"Kiri, issue unknown",label:"A small creative project with a large remit.",span:"wide",hover:"lift",story:{title:"Kiri",draft:!0,body:["Kiri is a creative storytelling project of mine, about self-discovery, making things, and the slower life I keep claiming to want.","It began as a way to say out loud some things that do not fit in a slide. It continues because the slides keep coming."]}},{id:"question",art:"Tag",name:"A luggage tag",label:"Is a slow life a luxury or a discipline?",route:"human-condition",hover:"swing"},{id:"tower",art:"Tower",name:"A very small telecom tower",label:"One bar of signal, if you stand on the sofa.",hover:"signal",story:{title:"A very small telecom tower",draft:!0,body:["Architecture school taught me to look at towers. Strategy work taught me to ask who pays for them.","A telecom network is a strange kind of building. It has no front door and nobody admires the elevation, but entire towns reorganise around it. I find that very moving, and I have learned not to say so in meetings."]}}];var dl={intro:"The main text is what I would say in a meeting. The margins are what I was thinking.",draft:!0,page:[{t:"I used to think a good decision was one you could defend. Consulting confirms this daily. Then I noticed how many "},{t:"defensible decisions",note:"Defensible by whom? Usually a future version of yourself, in a room that does not exist yet."},{t:" had left the people who made them a little smaller, the way a building can meet every regulation and still be "},{t:"unpleasant to stand in",note:"Architecture school gives you a word for this. It is \u201Ccode-compliant.\u201D"},{t:". What I want now is harder to put on a slide. I want to know which of my plans are "},{t:"really plans",note:"As opposed to weather forecasts with my name on them."},{t:" and which are stories I tell at dinner, like the "},{t:"house in the mountains",note:"Two bedrooms. A north light for painting. No idea what I would do on a Tuesday."},{t:". Most of the time I suspect the contradiction is the "},{t:"whole arrangement",note:"Do not resolve this. Look at it again in five years."},{t:"."}],fragments:["If you are very efficient at resting, have you rested?","The word for a thing is usually older than our doubt about it.","Nobody admires a temple for being on schedule.","Why does a clean desk feel like a promise and a full one like a person?","Unfinished idea: a business that only sells things you can repair.","Unfinished idea: a map of Indian cities by what they smell like at 6 a.m."]},pn={intro:"Pull a spine for a note.",shelves:[{id:"vedic",name:"Vedic and Sanskrit",books:[{t:"The Upanishads",a:"trans. Eknath Easwaran",n:"The conversations at the edge of the Vedas. Short, strange, and very direct about what is real."},{t:"The Bhagavad Gita",a:"trans. Eknath Easwaran",n:"A strategy discussion held on a battlefield at the worst possible time."},{t:"The Yoga Sutras of Patanjali",a:"trans. Edwin Bryant",n:"196 short threads. Bryant\u2019s commentary tells you what the tradition has said about each."},{t:"The Dance of Shiva",a:"Ananda Coomaraswamy",n:"Early 20th-century essays arguing that Indian art is a way of thinking."}]},{id:"built",name:"Buildings and space",books:[{t:"The Poetics of Space",a:"Gaston Bachelard",n:"A philosopher goes through a house room by room, including the drawers."},{t:"A Pattern Language",a:"Christopher Alexander et al.",n:"253 patterns for building, from regions down to window seats."},{t:"The Eyes of the Skin",a:"Juhani Pallasmaa",n:"On how architecture lost its other senses."},{t:"Thinking Architecture",a:"Peter Zumthor",n:"A very short book by a very slow architect."},{t:"Invisible Cities",a:"Italo Calvino",n:"Marco Polo describes fifty-five cities to Kublai Khan. It may be one city."}]},{id:"work",name:"Strategy and work",books:[{t:"Good Strategy Bad Strategy",a:"Richard Rumelt",n:"Most strategy is a list of wishes. Rumelt says so with examples."},{t:"Thinking, Fast and Slow",a:"Daniel Kahneman",n:"A useful catalogue of how a confident mind goes wrong."}]},{id:"scent",name:"Scent and cloth",books:[{t:"The Secret of Scent",a:"Luca Turin",n:"A biophysicist with strong opinions and a good ear for sentences."},{t:"Perfume",a:"Patrick S\xFCskind",n:"A novel told mostly through the nose. Not a guide to anything."},{t:"Saris: Tradition and Beyond",a:"Rta Kapur Chishti",n:"The drapes of India, documented region by region."}]},{id:"life",name:"How to live, allegedly",books:[{t:"Man\u2019s Search for Meaning",a:"Viktor Frankl",n:"Half memoir of the camps, half theory. The first half makes the second half hard to argue with."},{t:"Walden",a:"Henry David Thoreau",n:"Slow-living classic. His mother did some of his laundry, and it is still worth reading."},{t:"The Guide",a:"R. K. Narayan",n:"A fraud becomes a holy man, possibly by accident."}]}]},mn={intro:"Throw them around. Click one to read the back.",draft:!0,been:[{id:"hamirpur",place:"Hamirpur",state:"Himachal Pradesh",scene:"hills",tone:"#5f7043",back:"Five years learning to draw in a town where the view keeps interrupting. Most of what I know about light I learned being late to studio."},{id:"kozhikode",place:"Kozhikode",state:"Kerala",scene:"sea",tone:"#2f5a55",back:"Two years on a hilltop campus near the Arabian Sea, learning to reduce everything to a matrix. The monsoon does not reduce."},{id:"rishikesh",place:"Rishikesh",state:"Uttarakhand",scene:"river",tone:"#4a7a78",back:"The Ganga comes out of the hills here, still cold and in a hurry."},{id:"manali",place:"Manali",state:"Himachal Pradesh",scene:"pagoda",tone:"#3e5a3c",back:"The Hadimba temple is wood, cedar-dark and four roofs high, built in 1553 in a forest of deodars. A temple that knows it is in the mountains."},{id:"prayagraj",place:"Prayagraj",state:"Mahakumbh",scene:"river",tone:"#a86a3f",back:"A temporary city for a very old idea. Everyone there was looking for something and almost nobody was looking at their phone."},{id:"mumbai",place:"Mumbai",state:"Maharashtra",scene:"city",tone:"#7a5a4b",back:"The route took three local trains and a spreadsheet. I enjoy this more than I should."}],dreams:[{id:"spiti",place:"Spiti",state:"A place to end up",scene:"hills",tone:"#b08a5a",back:"On the list. A valley with very few reasons to check email."},{id:"hampi",place:"Hampi",state:"On the list",scene:"temple",tone:"#b4593a",back:"Boulders and ruined bazaars. I would like to measure something there."},{id:"modhera",place:"Modhera",state:"On the list",scene:"temple",tone:"#7f6a3a",back:"A sun temple with a stepped tank in front. Architects are not calm about it."}]},fr={intro:"Slide a box open. These are all true.",items:[{box:"Rain",text:"The smell of rain on dry earth was named petrichor by two Australian scientists in 1964, in the journal Nature. Kannauj had been bottling it for a long time by then, as mitti attar.",href:"https://en.wikipedia.org/wiki/Petrichor"},{box:"Grammar",text:"P\u0101\u1E47ini\u2019s A\u1E63\u1E6D\u0101dhy\u0101y\u012B describes Sanskrit in about four thousand compact rules, around the 4th century BCE. Computer scientists later found they had been reinventing some of its notation.",href:"https://en.wikipedia.org/wiki/P%C4%81%E1%B9%87ini"},{box:"Ellora",text:"The Kailasa temple at Ellora was not built. It was removed. Masons carved downward from the top of a basalt cliff, so there was no scaffolding and no second try.",href:"https://en.wikipedia.org/wiki/Kailasa_temple,_Ellora"},{box:"Binary",text:"In the Chanda\u1E25\u015B\u0101stra, the scholar Pi\u1E45gala catalogued Sanskrit metres as patterns of short and long syllables, which is a binary system, around two thousand years ago.",href:"https://en.wikipedia.org/wiki/Pingala"},{box:"Shampoo",text:"\u201CShampoo\u201D comes from the Hindi ch\u0101mpo, to press or knead. It meant a head massage long before it meant a bottle.",href:"https://en.wikipedia.org/wiki/Shampoo"},{box:"Stepwell",text:"Rani ki Vav in Patan is an inverted temple. You walk down into it, seven levels, past hundreds of carved figures, to reach water.",href:"https://whc.unesco.org/en/list/922/"},{box:"Jantar",text:"The Samrat Yantra at Jaipur is a sundial 27 metres tall. Its shadow moves fast enough to watch.",href:"https://whc.unesco.org/en/list/1338/"},{box:"Nose",text:"After a while you stop smelling your own perfume. It is called olfactory fatigue, and it explains the person who applies more at lunch.",href:"https://en.wikipedia.org/wiki/Olfactory_fatigue"},{box:"Kolam",text:"Kolam drawings, made fresh on thresholds each morning in South India, have been studied by computer scientists as formal picture languages.",href:"https://en.wikipedia.org/wiki/Kolam"},{box:"Tapputi",text:"The first perfumer we know by name was a woman in Assyria, about 3,200 years ago. The first chemist we know by name, some would argue, is the same person.",href:"https://worldsensorium.com/tapputi-badakallim-the-oldest-perfumer-on-record/"},{box:"Correa",text:"Charles Correa\u2019s Jawahar Kala Kendra in Jaipur is laid out as a nine-square mandala of the planets, with one square shifted to make the entrance.",href:"https://en.wikipedia.org/wiki/Jawahar_Kala_Kendra"},{box:"3 kg",text:"One Banarasi sari at the V&A weighs about three kilograms because of the gold in it. It was probably never worn.",href:"https://collections.vam.ac.uk/item/O77719/banarasi-sari-unknown/"}]},Ga={intro:"Painting is the one thing I do badly on purpose. There is a canvas here that anyone can add to.",palette:["#b4593a","#23402f","#d9b768","#6d6f3e","#2a2a26","#f1e8d6"],gallery:[{title:"Study for a north window",medium:"Stand-in until the real painting is scanned",seed:3,placeholder:!0},{title:"Monsoon, second attempt",medium:"Stand-in until the real painting is scanned",seed:11,placeholder:!0},{title:"Hills that owe me money",medium:"Stand-in until the real painting is scanned",seed:21,placeholder:!0},{title:"Terracotta, interrupted",medium:"Stand-in until the real painting is scanned",seed:34,placeholder:!0},{title:"Sketch of a thought",medium:"Stand-in until the real painting is scanned",seed:47,placeholder:!0}],journal:[{t:"Acrylic dries faster than I change my mind. This is its main advantage over oil and its main drawback.",draft:!0},{t:"An architect\u2019s first painting is usually a very neat rectangle. It took a while to get worse.",draft:!0},{t:"Sketchbook rule: no page gets to be good.",draft:!0}]},dr={intro:"Plan chests keep flat things flat. Pull a drawer.",drawers:[{id:"banarasi",name:"Banarasi brocade",region:"Varanasi, Uttar Pradesh",pattern:"kalga",ground:"#23402f",gold:"#d2ab59",text:"Silk woven with gold-wrapped supplementary weft. It gets its own room.",route:"attire-archive"},{id:"patola",name:"Patan patola",region:"Patan, Gujarat",pattern:"ikat",ground:"#7b3524",gold:"#e4d3ad",text:"Double ikat. Warp and weft are both resist-dyed before weaving and must meet exactly, thread by thread, for the pattern to appear."},{id:"kanjivaram",name:"Kanjivaram",region:"Kanchipuram, Tamil Nadu",pattern:"temple",ground:"#7c5a24",gold:"#f0d48c",text:"Heavy mulberry silk. The contrasting border and pallu are often woven separately and joined with the korvai technique, so firmly that the join holds for generations."},{id:"paithani",name:"Paithani",region:"Paithan, Maharashtra",pattern:"peacock",ground:"#34553f",gold:"#e0bd6a",text:"Tapestry-woven, with the same finish on both sides. Peacocks and lotuses on the pallu."},{id:"jamdani",name:"Jamdani",region:"Bengal",pattern:"buti",ground:"#e4dcc8",gold:"#7a7a55",text:"Fine cotton with motifs inlaid by hand, as if embroidered at the loom. UNESCO inscribed the traditional art of Jamdani weaving of Bangladesh in 2013."},{id:"phulkari",name:"Phulkari",region:"Punjab",pattern:"stitch",ground:"#6e2f22",gold:"#e0a44e",text:"Darning stitches in floss silk, worked from the reverse of the cloth. The name means flower work."},{id:"kalamkari",name:"Kalamkari",region:"Srikalahasti and Machilipatnam, Andhra Pradesh",pattern:"vine",ground:"#d9c9a6",gold:"#6e3b24",text:"Literally pen work. Natural dyes applied with a bamboo kalam. Long narrative panels were made as temple hangings."},{id:"kundan",name:"Kundan",region:"Rajasthan and the Mughal courts",pattern:"stones",ground:"#2f2a22",gold:"#e5c67c",text:"Gemstones set with strips of highly refined gold foil, no prongs. Often backed in enamel, so the reverse is a second artwork."}]},gn={intro:"Five things I cannot settle. Move the weight and see how the argument changes.",draft:!0,scales:[{left:"Ambition",right:"Slow living",readings:["All the way left, every weekend is a project with a deliverable.","Leaning left: you keep saying you will rest after this one.","Level, for about a day and a half at a time. Then something comes up.","Leaning right: you have started to enjoy being unreachable, which is its own form of status.","All the way right, you are in the mountains, explaining your morning routine to someone."]},{left:"Modernity",right:"Tradition",readings:["A sari is an inefficient garment and you are sure of it.","You will wear the sari, and bring the laptop.","A thing can be ancient and still be the best current design.","You ask your grandmother for the recipe and she does not measure anything.","Everything was better before. You read this on your phone."]},{left:"Logic",right:"Spirituality",readings:["Nothing is real until it has a denominator.","You meditate, and track how many days in a row.","The Upanishads argue by asking. It turns out that counts.","You no longer need the mantra to have a mechanism.","You stopped asking what it is for. People find this annoying."]},{left:"Professional self",right:"Creative self",readings:["Your hobbies have a LinkedIn post.","You paint on Sundays, and think about Monday while it dries.","They have started to borrow each other\u2019s tools.","The slide deck has a good colour palette and nobody knows why.","You have not opened email since the canvas arrived."]},{left:"Beautiful things",right:"Inner life",readings:["You know exactly which silk, and which year.","You want the object and also want to stop wanting it.","A good thing, looked at closely, is a form of attention.","You gave the perfume away and kept the memory of it, mostly.","You own one bowl. It is a very good bowl."]}],observations:["People who say they hate small talk are usually very good at it.","Most arguments between couples are about who is noticing.","Nobody is as decided as their LinkedIn.","We forgive places much faster than people."]},yn={updated:"November 2026",draft:!0,sheets:[{verb:"Reading",item:"Psychology and spiritual books, in an order that would worry a librarian",note:"More or less in this order."},{verb:"Learning",item:"Python, slowly, in the gaps between meetings",note:"For the data and the dashboards."},{verb:"Making",item:"An acrylic that keeps changing its mind, and the next Kiri story",note:"No deadline, which is the problem."},{verb:"Exploring",item:"What builders and real estate look like ten years from now",note:"A long report. Coming eventually."},{verb:"Thinking about",item:"What a Tuesday would be like in the mountains",note:"Still no good answer."}]},vn={heading:"A life, floor by floor",intro:"Drag the lift or press a floor.",floors:[{id:"foundations",level:"Foundations",when:"Undated",title:"Foundations",room:"footing",body:"Foundations are not shown on public drawings. This is standard practice.",draft:!0},{id:"hamirpur",level:"Level 1",when:"2014 to 2019",title:"Learning to draw",room:"studio",body:"Architecture at NIT Hamirpur, in the hills of Himachal. Five years of models, all-nighters and being told a line was wrong by someone who was usually right.",image:null},{id:"studio",level:"Level 2",when:"After graduation",title:"A small studio",room:"interior",body:"An interiors practice of my own. Clients, contractors, and an early education in the distance between what is drawn and what arrives on site.",draft:!0},{id:"bim",level:"Level 3",when:"Until 2022",title:"Buildings, modelled",room:"model",body:"Modelling American houses and offices from India, checking that the pipes missed the beams. I have never seen most of them. I know where their ducts are.",draft:!0},{id:"kozhikode",level:"Level 4",when:"2022 to 2024",title:"Kozhikode",room:"matrix",body:"An MBA at IIM Kozhikode. Traded section drawings for 2\xD72s, and discovered that a business is also a building: mostly circulation, with a few rooms where anything happens."},{id:"strategy",level:"Level 5",when:"Now",title:"Towers and townships",room:"desk",body:"Strategy work across telecom, real estate and technology. People pay me to ask what happens next, which I would be doing anyway.",draft:!0},{id:"weekends",level:"Level 6",when:"Weekends",title:"The room with the good light",room:"easel",body:"Acrylics, sketchbooks and Kiri. This floor was added without permission and is now load-bearing.",draft:!0},{id:"unbuilt",level:"Roof",when:"Not yet",title:"Under construction",room:"sky",body:"Planning permission pending. The site is somewhere with mountains. The drawings keep changing.",draft:!0}]},T1=[{kind:"A thought",text:"If you are very efficient at resting, have you rested?",route:"marginalia",draft:!0},{kind:"A fact",text:"Petrichor was named in 1964. Kannauj had already been distilling it from baked clay as mitti attar.",href:"https://en.wikipedia.org/wiki/Petrichor"},{kind:"A book",text:"Invisible Cities, by Italo Calvino. Marco Polo describes fifty-five cities. It may be one city.",route:"bibliotech"},{kind:"A discovery",text:"Double ikat: in a Patan patola, warp and weft are each dyed first and must meet exactly when woven.",route:"cultural-cabinet"},{kind:"An object",art:"Compass",text:"The compass in the cabinet points at you. Go and check.",route:"odysseys"},{kind:"A fact",text:"One small 2025 study found skin hydration, and not pH, affected how perfume molecules left the skin. Ten forearms, large implications for moisturiser.",route:"scent-archive"},{kind:"A question",text:"Is a slow life a luxury or a discipline?",route:"human-condition"},{kind:"A thought",text:"Nobody admires a temple for being on schedule.",route:"marginalia",draft:!0},{kind:"An object",art:"Perfume",text:"A perfume at noon is not the perfume you bought at ten.",route:"scent-archive"},{kind:"A fact",text:"The Kailasa temple at Ellora was carved from the top of the rock downward. There was no second try.",href:"https://en.wikipedia.org/wiki/Kailasa_temple,_Ellora"},{kind:"A discovery",text:"In kadhua weaving each motif is worked in by hand, so the back of the cloth looks almost like the front. A good test for a lot of things.",route:"attire-archive"},{kind:"An object",art:"Juttis",text:"Handmade juttis are often cut with no left or right. The shoe finds out from you."},{kind:"A book",text:"The Poetics of Space, by Gaston Bachelard. A philosopher takes a house room by room, including the drawers.",route:"bibliotech"},{kind:"A thought",text:"Why does a clean desk feel like a promise and a full one like a person?",route:"marginalia",draft:!0},{kind:"After dark",night:!0,text:"You found the night shift. Hold your lamp up to the wall above the shelf.",route:""}];var At={title:"The Art of Perfume",intro:"A perfume is a slow chemical event that happens to smell nice. Drag the hours along and watch it leave.",stages:[{id:"top",name:"Top notes",from:0,to:.4,color:"#c8a23c",gloss:"The first fifteen minutes or so. Small, light molecules that evaporate quickly. This is the part you smelled in the shop, and the part you did not buy.",notes:[{name:"Bergamot",says:"Citrus with a bitter, tea-like edge. Its peel oil is rich in limonene and linalyl acetate."},{name:"Pink pepper",says:"Sparkle with no heat. A rosy, resinous dry spice."},{name:"Green cardamom",says:"Cold, camphorous and sweet. It reads as a cool draft in a warm blend."}]},{id:"heart",name:"Heart notes",from:.25,to:3,color:"#b4593a",gloss:"The character of the thing, once the opening has cleared. Mid-weight florals and spices that stay for an hour or more.",notes:[{name:"Rose",says:"Hundreds of compounds. Citronellol and geraniol do much of the talking."},{name:"Jasmine",says:"Sweet and faintly animalic. Indian jasmine carries a natural trace of indole, the molecule that keeps white florals from smelling like soap."},{name:"Tuberose",says:"Waxy, buttery and loud. It enters the room before you do."}]},{id:"base",name:"Base notes",from:1.5,to:8,color:"#4d5a33",gloss:"Heavy molecules that take hours to leave. What your scarf remembers the next morning.",notes:[{name:"Mysore sandalwood",says:"Creamy, milky wood. Also the traditional oil base of Indian attars."},{name:"Vetiver",says:"An earthy, smoky root. In summer it is woven into khus screens and wetted to cool a room."},{name:"Mitti",says:"Baked clay distilled in Kannauj, to smell like the first rain on dry earth."}]}],underrated:{heading:"An underrated fact",claim:"It may not be your skin\u2019s pH.",body:["Everyone has heard that perfume smells different on you because of your skin chemistry, usually meaning pH. A 2025 study in the International Journal of Cosmetic Science put eight fragrance molecules on the forearms of ten volunteers and measured what evaporated.","pH, sebum and skin temperature did not reach statistical significance. Skin hydration did, along with water loss and surface roughness. The heavier molecules evaporated less from better-hydrated skin. Rougher skin released more of the volatile ones, the opposite of what the researchers had expected.","Ten forearms is a small sample and the authors say so. Across the study\u2019s molecules, vapour pressure ran from 14 mmHg to 0.002 mmHg, a 7,000-fold range. Which is the real reason the top, heart and base exist at all."],source:{href:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12666731/",text:"Hadjiefstathiou et al., 2025, International Journal of Cosmetic Science"}},history:[{when:"c. 1239 BCE",title:"Tapputi of Ashur",text:"The oldest named perfumer on record. A Middle Assyrian tablet, KAR 220, records a formula \u201Cfrom the mouth of\u201D a woman called Tapp\u016Bt\u012B-B\u0113let-ekallim. Her title was muraqq\u012Btu, perfumer. Flowers, calamus, myrrh, balsam, water and oil.",href:"https://worldsensorium.com/tapputi-badakallim-the-oldest-perfumer-on-record/",linkText:"World Sensorium"},{when:"13th to 17th century",title:"The Gandhas\u0101ra",text:"India\u2019s earliest detailed texts on perfume-making, the Gandhas\u0101ra and Gandhav\u0101da, set out the craft as a body of knowledge, with its own recipes and vocabulary.",href:"https://livehistoryindia.com/story/living-culture/kannauj-attar",linkText:"Live History India"},{when:"Still running",title:"Deg and bhapka",text:"In Kannauj, petals are heated in copper degs. Steam passes along bamboo pipes into a bhapka of sandalwood oil cooling in water. The oil takes the scent. No alcohol at all. The town received a Geographical Indication in 2014 and its distilleries are far fewer than they were.",href:"https://livehistoryindia.com/story/living-culture/kannauj-attar",linkText:"Live History India"}],further:[{href:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12666731/",text:"Exploring the impact of fragrance molecular and skin properties on the evaporation profile of fragrances (2025)"},{href:"https://onlinelibrary.wiley.com/doi/10.1046/j.1467-2494.2003.00193.x",text:"Two-stage kinetic analysis of fragrance evaporation and absorption from skin (2003)"},{href:"https://onlinelibrary.wiley.com/doi/abs/10.1111/j.1467-2494.1995.tb00110.x",text:"Headspace analysis study of evaporation rate of perfume ingredients applied onto skin (1995)"},{href:"https://pubs.acs.org/doi/10.1021/acs.iecr.9b01004",text:"Evaporation and permeation of fragrance applied to the skin (2019)"},{href:"https://en.wikipedia.org/wiki/Olfactory_fatigue",text:"Olfactory fatigue, or why you stop smelling your own perfume"}],notebook:[]};var ca={title:"The Indian Attire Archive",intro:"A Banarasi sari is about six yards of silk. No seam, no fastening, and no agreement on how to wear it.",chapters:[{id:"history",pin:"Pallu",heading:"History of the textile",body:["Varanasi is among India\u2019s oldest fine-weaving centres and grew into a silk centre during the Mughal period. The usual account of its brocades traces them to Gujarati weavers who moved north after a famine in 1603, joining a city that already knew cloth.","Through the 18th and 19th centuries the work grew finer. By 1851 a Banarasi sari could be sent to London as a showpiece. The Victoria and Albert Museum holds one from about 1850 that weighs roughly three kilograms because of its gold-wrapped thread. It was probably made for the Great Exhibition and was probably never worn."]},{id:"craft",pin:"Border",heading:"Regional craftsmanship",body:["\u201CBanaras Brocades and Sarees\u201D received Geographical Indication status in 2009. Only work from six districts of Uttar Pradesh may carry the name: Varanasi, Mirzapur, Chandauli, Bhadohi, Jaunpur and Azamgarh.","Around Varanasi about 1.2 million people are said to depend on the silk handloom trade, directly or indirectly. A sari takes between fifteen days and six months, depending on how much the design asks.","Weavers name the patterns by structure. Jangla is a dense spreading vine. Butidar is scattered small flowers. Tanchoi builds its pattern mainly from extra silk wefts. Tissue glows because zari runs through the weft itself."]},{id:"weave",pin:"Zari",heading:"Weaving techniques",body:["Banarasi patterns come from a supplementary weft: extra threads, often silk wrapped in drawn gold or silver, laid in alongside the ground weave. The base cloth holds the pattern. The pattern does not hold the cloth.","The important split is kadhua and phekwa. In kadhua each motif is woven in by hand, one at a time, so the reverse looks almost as finished as the front. It is slow. In phekwa the extra thread runs edge to edge and the floats between motifs are cut away afterward. Quicker, and less durable.","Patterns were once stored in a hand-tied naksha and read by a draw-loom. Jacquard punched cards replaced much of that in the last two centuries. A very old loom turned out to be a programmable one."]},{id:"meaning",pin:"Kalga",heading:"Cultural significance",body:["A Banarasi is often the sari a family buys once. It gets worn at weddings, then kept in muslin, then unfolded to be shown to someone younger.","The motifs carry a long conversation between Persian and Indian design. The kalga, a curling paisley, sits beside the bel, a running vine, and along the end runs the jhallar, a row of upright leaves. One pallu at the V&A has flower motifs, a floral meander and a chevron called khanjuri."]},{id:"drape",pin:"Drape",heading:"Different Indian draping traditions",body:["Textile scholar Rta Kapur Chishti has documented at least 108 distinct regional drapes. The one most people picture, the nivi, became dominant only recently. In the 1860s Gyanodanandini Devi, a Tagore by marriage, returned from the Bombay Presidency wearing a style adapted from Parsi women, with a blouse and petticoat. It was called Bombay Dastur, and film and the freedom movement carried it across the country."],showDrapes:!0},{id:"museums",pin:"Label",heading:"Museum collections and references",body:["These are the records worth opening. Museum catalogue entries are the closest most of us get to handling the cloth."],showRefs:!0}],drapes:[{id:"nivi",name:"Nivi",where:"Widespread, with roots in Andhra",how:"Pleats tucked at the centre of the waist. The pallu goes over the left shoulder and leaves the right arm free."},{id:"nauvari",name:"Nauvari",where:"Maharashtra",how:"Nine yards, no petticoat. The cloth passes between the legs with dhoti-like pleats at the back, built for moving and for riding."},{id:"seedha",name:"Seedha pallu",where:"Gujarat, Uttar Pradesh, Odisha",how:"The pallu comes forward over the right shoulder and spreads across the front, so its pattern faces the world."},{id:"coorgi",name:"Kodagu",where:"Coorg, Karnataka",how:"Pleats at the back, and the end passes under the left shoulder and over the right. Often with a matching headscarf."},{id:"atpoure",name:"Atpoure",where:"West Bengal",how:"Wide box pleats, and the end thrown over the shoulder. Traditionally white with a red border, sometimes weighted with a bunch of keys."},{id:"neriyathum",name:"Mundum neriyathum",where:"Kerala",how:"Two pieces. The mundu is the lower garment. The neriyathu goes across from the right hip to the left shoulder."}],references:[{href:"https://collections.vam.ac.uk/item/O77719/banarasi-sari-unknown/",title:"Banarasi sari, about 1850",where:"Victoria and Albert Museum, 769-1852",note:"Silk with gold-wrapped thread, 371 \xD7 171 cm, about 3 kg."},{href:"https://collections.vam.ac.uk/item/O164446/banarasi-sari/",title:"Banarasi sari, about 1850",where:"Victoria and Albert Museum",note:"Crimson si
